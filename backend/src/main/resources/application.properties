# 1. Spring Boot Application Name
spring.application.name=mongo-ai-agent

# 2. MongoDB Configuration
# If running MongoDB locally on default port 27017, this creates a DB named 'ai_support_db'
spring.data.mongodb.uri=mongodb://localhost:27017/ai_support_db

# 3. Spring AI Ollama Configurations
# This points to your local running Ollama instance
spring.ai.ollama.base-url=http://localhost:11434
# This specifies the exact model we pulled in the terminal
spring.ai.ollama.chat.options.model=llama3
# Set the temperature (0.7 gives a balance of creativity and factual execution)
spring.ai.ollama.chat.options.temperature=0.7